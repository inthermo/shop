<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather — Will's Places</title>
<style>
  :root{
    --hdr:#00417d; --hdr2:#0059b3; --bg:#f4f6f8; --card:#fff; --line:#d8dee4;
    --ink:#1a1a1a; --ink2:#556; --muted:#8893a0;
    --warm:#c62828; --cold:#0062bc; --cwarm:#c62828; --ccold:#0062bc;
    --precip:#006edb; --precipbar:#cfe6fb;
    --rowhov:#f0f6fd; --chip:#e8eef5; --chipink:#123;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --hdr:#0a2c50; --hdr2:#0d3a6b; --bg:#10151b; --card:#1a2129; --line:#2c3743;
      --ink:#e8edf2; --ink2:#a8b4c0; --muted:#6d7a88;
      --warm:#ff7b6e; --cold:#6db4ff; --cwarm:#e85d4f; --ccold:#2f8fe8;
      --precip:#5aa9ff; --precipbar:#173a5e;
      --rowhov:#1f2937; --chip:#243040; --chipink:#dbe6f2;
    }
  }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif; background:var(--bg); color:var(--ink); }
  header{ background:var(--hdr); color:#fff; padding:14px 16px 0; }
  .hrow{ max-width:760px; margin:0 auto; display:flex; align-items:center; gap:10px; }
  .hrow h1{ margin:0; font-size:20px; flex:1; font-weight:600; }
  .units{ display:flex; border:1px solid rgba(255,255,255,.45); border-radius:8px; overflow:hidden; }
  .units button{ background:transparent; color:#fff; border:0; font:inherit; font-size:13px; padding:5px 12px; cursor:pointer; }
  .units button.on{ background:#fff; color:var(--hdr); font-weight:600; }
  nav{ max-width:760px; margin:0 auto; display:flex; gap:6px; overflow-x:auto; padding:12px 0 12px; -webkit-overflow-scrolling:touch; }
  nav button{ flex:none; background:var(--hdr2); color:#fff; border:0; border-radius:999px; font:inherit; font-size:14px; padding:8px 16px; cursor:pointer; opacity:.75; white-space:nowrap; }
  nav button.on{ background:#fff; color:var(--hdr); opacity:1; font-weight:600; }
  .wrap{ max-width:760px; margin:0 auto; padding:14px 12px 40px; }
  .meta{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin:2px 2px 10px; font-size:13px; color:var(--ink2); flex-wrap:wrap; }
  .meta b{ font-size:16px; color:var(--ink); font-weight:600; }
  .err{ background:#fdecea; color:#8b1a12; border:1px solid #f5c6c0; border-radius:10px; padding:10px 14px; font-size:14px; margin-bottom:12px; }
  @media (prefers-color-scheme: dark){ .err{ background:#3a1512; color:#ffb4aa; border-color:#5c221c; } }

  details.day{ background:var(--card); border:1px solid var(--line); border-radius:12px; margin-bottom:10px; overflow:hidden; }
  summary{ list-style:none; cursor:pointer; padding:12px 14px; display:grid; align-items:center; gap:4px 10px;
    grid-template-columns:minmax(86px,1.1fr) auto 1fr auto; }
  summary::-webkit-details-marker{ display:none; }
  .dname{ font-weight:600; font-size:15px; }
  .ddate{ font-size:12px; color:var(--muted); }
  .dsyms{ font-size:20px; letter-spacing:2px; white-space:nowrap; }
  .dtemps{ text-align:right; font-size:15px; white-space:nowrap; }
  .dxtra{ text-align:right; font-size:13px; white-space:nowrap; }
  .dxtra .pr{ color:var(--precip); font-weight:600; }
  .dxtra .wd{ color:var(--ink2); margin-left:10px; }
  .warm{ color:var(--warm); } .cold{ color:var(--cold); }
  details[open] summary{ border-bottom:1px solid var(--line); }
  .sunrow{ padding:8px 12px; font-size:13px; color:var(--ink2); border-bottom:1px solid var(--line); display:flex; gap:18px; }

  table{ width:100%; border-collapse:collapse; font-size:14px; }
  th{ text-align:right; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); font-weight:600; padding:8px 10px 4px; }
  th:first-child{ text-align:left; }
  td{ padding:6px 10px; text-align:right; border-top:1px solid var(--line); white-space:nowrap; }
  tr:first-child td{ border-top:0; }
  td.hh{ text-align:left; color:var(--ink2); font-variant-numeric:tabular-nums; }
  td.sym{ text-align:center; font-size:19px; padding:2px 4px; }
  td.tmp{ font-weight:600; font-variant-numeric:tabular-nums; }
  td.fl{ color:var(--ink2); font-variant-numeric:tabular-nums; }
  td.pr{ color:var(--precip); font-weight:600; font-variant-numeric:tabular-nums; position:relative; }
  td.pr .bar{ position:absolute; left:2px; right:2px; bottom:2px; height:3px; border-radius:2px; background:var(--precip); opacity:.55; }
  td.pr.zero{ color:var(--muted); font-weight:400; opacity:.45; }
  td.wnd{ color:var(--ink2); font-variant-numeric:tabular-nums; }
  td.wnd .gust{ color:var(--muted); font-size:12px; }
  td.wnd .arr{ display:inline-block; margin-left:5px; color:var(--muted); }
  tr:hover td{ background:var(--rowhov); }

  #histCard summary{ display:flex; justify-content:space-between; align-items:center; gap:10px; }
  #histCard .dname{ font-size:15px; }
  .hleg{ display:flex; gap:14px; font-size:12px; color:var(--ink2); }
  .hleg i{ display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px; }
  .hwrap{ position:relative; padding:10px 8px 6px; }
  .hwrap svg{ display:block; width:100%; height:auto; }
  .htip{ position:absolute; display:none; pointer-events:none; background:var(--card); border:1px solid var(--line);
    border-radius:8px; padding:6px 10px; font-size:12px; box-shadow:0 2px 8px rgba(0,0,0,.18); white-space:nowrap; z-index:2; }
  .htip b{ font-weight:600; }
  .gline{ stroke:var(--line); stroke-width:1; }
  .glab{ fill:var(--muted); font-size:11px; font-family:inherit; }
  .thr{ stroke:var(--muted); stroke-width:1; stroke-dasharray:4 4; }

  /* overview */
  .ovcard{ background:var(--card); border:1px solid var(--line); border-radius:12px; margin-bottom:10px; padding:12px 14px; cursor:pointer; }
  .ovcard:hover{ background:var(--rowhov); }
  .ovhead{ display:flex; align-items:baseline; gap:8px; margin-bottom:8px; }
  .ovhead b{ font-size:16px; }
  .ovsub{ font-size:12px; color:var(--muted); flex:1; }
  .ovtime{ font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .ovdel{ border:0; background:transparent; color:var(--muted); font-size:16px; cursor:pointer; padding:0 2px; line-height:1; }
  .ovdel:hover{ color:var(--warm); }
  .ovstats{ display:flex; flex-wrap:wrap; gap:6px 18px; align-items:center; }
  .ovnow{ display:flex; align-items:center; gap:8px; min-width:96px; }
  .ovnow .s{ font-size:30px; }
  .ovnow .t{ font-size:28px; font-weight:600; }
  .ovs label{ display:block; font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
  .ovs b{ font-size:14px; font-weight:600; font-variant-numeric:tabular-nums; }
  .addbtn{ width:100%; background:transparent; border:1.5px dashed var(--line); color:var(--ink2); border-radius:12px; padding:13px; font:inherit; font-size:14px; cursor:pointer; }
  .addbtn:hover{ background:var(--rowhov); }
  .addbox{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:10px; }
  .addbox .srow{ display:flex; gap:8px; }
  .addbox input{ flex:1; font:inherit; font-size:15px; padding:9px 12px; border:1px solid var(--line); border-radius:9px; background:var(--bg); color:var(--ink); }
  .addbox .go{ background:var(--hdr2); color:#fff; border:0; border-radius:9px; padding:9px 16px; font:inherit; cursor:pointer; }
  .gres{ display:flex; width:100%; text-align:left; align-items:baseline; gap:8px; background:transparent; border:0; border-top:1px solid var(--line); padding:10px 4px; font:inherit; cursor:pointer; color:var(--ink); }
  .gres:hover{ background:var(--rowhov); }
  .gres small{ color:var(--muted); }
  .gres:first-of-type{ margin-top:10px; }
</style>
</head>
<body>
<header>
  <div class="hrow">
    <h1>🌦️ Weather</h1>
    <div class="units" id="units">
      <button data-u="metric">°C</button><button data-u="imperial">°F</button>
    </div>
  </div>
  <nav id="tabs"></nav>
</header>
<div class="wrap">
  <div class="meta"><b id="placeName"></b><span id="updated"></span></div>
  <div id="msg"></div>
  <div id="content"></div>
  <details class="day" id="histCard" style="display:none">
    <summary>
      <div class="dname">Past 30 days — highs &amp; lows</div>
      <div class="hleg"><span><i style="background:var(--cwarm)"></i>High</span><span><i style="background:var(--ccold)"></i>Low</span></div>
    </summary>
    <div class="hwrap"><div id="hist"></div><div class="htip" id="htip"></div></div>
  </details>
</div>
<footer style="text-align:center;color:var(--muted);font-size:12px;padding:6px 0 30px">
  Forecast data: <a href="https://open-meteo.com/" target="_blank" rel="noopener" style="color:inherit">Open-Meteo</a> · hours &amp; dates are local to each place
</footer>

<script>
'use strict';
const DEFAULTS = [
  { id:'grunstadt', name:'Grünstadt',        sub:'Germany',        lat:49.569,  lon:8.168   },
  { id:'stpaul',    name:'St. Paul (55105)', sub:'Minnesota, USA', lat:44.9346, lon:-93.1673},
  { id:'stavanger', name:'Stavanger',        sub:'Norway',         lat:58.97,   lon:5.7331  },
  { id:'burton',    name:'Burton upon Trent',sub:'England',        lat:52.8066, lon:-1.643  },
];
const $ = id => document.getElementById(id);
let custom = [];
try{ custom = JSON.parse(localStorage.getItem('wx_custom') || '[]'); }catch(e){}
const PLACES = () => DEFAULTS.concat(custom);

let unit = localStorage.getItem('wx_unit') || 'metric';
let view = localStorage.getItem('wx_view') || 'overview';   // 'overview' | place id
if (view !== 'overview' && !PLACES().some(p => p.id === view)) view = 'overview';
const cache = {};      // placeId -> {data, at}
let ov = null;         // overview {data:[...], at}
let adding = false;

const WMO = {
  0:['☀️','🌙','Clear'], 1:['🌤️','🌙','Mostly clear'], 2:['⛅','☁️','Partly cloudy'], 3:['☁️','☁️','Overcast'],
  45:['🌫️','🌫️','Fog'], 48:['🌫️','🌫️','Rime fog'],
  51:['🌦️','🌧️','Light drizzle'], 53:['🌦️','🌧️','Drizzle'], 55:['🌧️','🌧️','Heavy drizzle'],
  56:['🌧️','🌧️','Freezing drizzle'], 57:['🌧️','🌧️','Freezing drizzle'],
  61:['🌦️','🌧️','Light rain'], 63:['🌧️','🌧️','Rain'], 65:['🌧️','🌧️','Heavy rain'],
  66:['🌧️','🌧️','Freezing rain'], 67:['🌧️','🌧️','Freezing rain'],
  71:['🌨️','🌨️','Light snow'], 73:['🌨️','🌨️','Snow'], 75:['❄️','❄️','Heavy snow'], 77:['🌨️','🌨️','Snow grains'],
  80:['🌦️','🌧️','Light showers'], 81:['🌧️','🌧️','Showers'], 82:['🌧️','🌧️','Heavy showers'],
  85:['🌨️','🌨️','Snow showers'], 86:['❄️','❄️','Snow showers'],
  95:['⛈️','⛈️','Thunderstorm'], 96:['⛈️','⛈️','Thunder w/ hail'], 99:['⛈️','⛈️','Thunder w/ hail'],
};
const sym = (code, isDay) => { const w = WMO[code] || ['❓','❓','—']; return [isDay ? w[0] : w[1], w[2]]; };

const cToF  = c => c * 9/5 + 32;
const conv  = c => unit === 'metric' ? c : cToF(c);
const fmtT  = c => Math.round(conv(c)) + '°';
const tCls  = c => c >= 0.5 ? 'warm' : 'cold';
const fmtW  = ms => unit === 'metric' ? Math.round(ms) : Math.round(ms * 2.23694);
const wUnit = () => unit === 'metric' ? 'm/s' : 'mph';
const fmtP  = mm => (Math.round(mm * 10) / 10).toFixed(1);
const hhmm  = iso => iso.slice(11, 16);
const esc   = s => s.replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));

function renderTabs(){
  $('tabs').innerHTML =
    `<button data-p="overview" class="${view === 'overview' ? 'on' : ''}">Overview</button>` +
    PLACES().map(p => `<button data-p="${p.id}" class="${p.id === view ? 'on' : ''}">${esc(p.name)}</button>`).join('');
  [...$('units').children].forEach(b => b.classList.toggle('on', b.dataset.u === unit));
}
$('tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  view = b.dataset.p; localStorage.setItem('wx_view', view);
  adding = false; renderTabs(); load();
});
$('units').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.dataset.u === unit) return;
  unit = b.dataset.u; localStorage.setItem('wx_unit', unit);
  renderTabs(); render();
});

function load(force){
  $('msg').innerHTML = '';
  if (view === 'overview') loadOverview(force); else loadPlace(force);
}

/* ---------- overview ---------- */
async function loadOverview(force){
  $('placeName').textContent = 'All places';
  $('histCard').style.display = 'none';
  const ids = PLACES().map(p => p.id).join(',');
  if (ov && ov.ids === ids && !force && Date.now() - ov.at < 20*60*1000){ render(); return; }
  if (ov && ov.ids === ids) render(); else if (!ov) $('content').innerHTML = '<div class="meta">Loading…</div>';
  const url = 'https://api.open-meteo.com/v1/forecast'
    + `?latitude=${PLACES().map(p => p.lat).join(',')}&longitude=${PLACES().map(p => p.lon).join(',')}`
    + '&current=temperature_2m,apparent_temperature,weather_code,is_day,precipitation,wind_speed_10m'
    + '&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,sunrise,sunset'
    + '&wind_speed_unit=ms&timezone=auto&forecast_days=1';
  try{
    const r = await fetch(url);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    ov = { data: Array.isArray(j) ? j : [j], at: Date.now(), ids };
    localStorage.setItem('wx_ov', JSON.stringify(ov));
    if (view === 'overview') render();
  }catch(err){
    if (!ov){ const s = localStorage.getItem('wx_ov'); if (s) try{ ov = JSON.parse(s); }catch(e){} }
    if (ov && ov.ids === ids) render(); else $('content').innerHTML = '';
    $('msg').innerHTML = `<div class="err">Couldn't fetch fresh data (${esc(err.message)}).` +
      (ov && ov.ids === ids ? ' Showing last saved data.' : ' Check the connection and reload.') + '</div>';
  }
}

function renderOverview(){
  $('updated').textContent = ov && ov.ids === PLACES().map(p => p.id).join(',')
    ? 'updated ' + new Date(ov.at).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}) : '';
  const cards = PLACES().map((p, i) => {
    const d = ov && ov.data[i];
    const del = p.id.startsWith('c') ? `<button class="ovdel" data-del="${p.id}" title="Remove place">✕</button>` : '';
    if (!d) return `<div class="ovcard" data-p="${p.id}"><div class="ovhead"><b>${esc(p.name)}</b><span class="ovsub">${esc(p.sub)}</span>${del}</div><div class="ovstats"><span class="ovsub">no data yet — tap to load</span></div></div>`;
    const cur = d.current, dl = d.daily;
    const [s, label] = sym(cur.weather_code, cur.is_day);
    const local = new Date(Date.now() + (d.utc_offset_seconds||0)*1000).toISOString().slice(11,16);
    const pr = dl.precipitation_sum[0] || 0;
    return `<div class="ovcard" data-p="${p.id}">
      <div class="ovhead"><b>${esc(p.name)}</b><span class="ovsub">${esc(p.sub)}</span><span class="ovtime">${local} local</span>${del}</div>
      <div class="ovstats">
        <div class="ovnow"><span class="s" title="${label}">${s}</span><span class="t ${tCls(cur.temperature_2m)}">${fmtT(cur.temperature_2m)}</span></div>
        <div class="ovs"><label>Feels like</label><b>${fmtT(cur.apparent_temperature)}</b></div>
        <div class="ovs"><label>High / Low</label><b><span class="${tCls(dl.temperature_2m_max[0])}">${fmtT(dl.temperature_2m_max[0])}</span> / <span class="${tCls(dl.temperature_2m_min[0])}">${fmtT(dl.temperature_2m_min[0])}</span></b></div>
        <div class="ovs"><label>Rain today</label><b style="color:var(--precip)">${pr > 0 ? fmtP(pr) + ' mm' : '0 mm'}</b></div>
        <div class="ovs"><label>Wind</label><b>${fmtW(cur.wind_speed_10m)} ${wUnit()}</b></div>
        <div class="ovs"><label>Sunrise</label><b>🌅 ${hhmm(dl.sunrise[0])}</b></div>
        <div class="ovs"><label>Sunset</label><b>🌇 ${hhmm(dl.sunset[0])}</b></div>
      </div>
    </div>`;
  }).join('');
  const addUi = adding ? `<div class="addbox">
      <div class="srow"><input id="q" placeholder="City name, e.g. Trondheim" autocomplete="off"><button class="go" id="qgo">Search</button></div>
      <div id="qres"></div>
    </div>` : `<button class="addbtn" id="addPlace">＋ Add place</button>`;
  $('content').innerHTML = cards + addUi;

  $('content').querySelectorAll('.ovcard').forEach(el => el.addEventListener('click', e => {
    if (e.target.closest('.ovdel')) return;
    view = el.dataset.p; localStorage.setItem('wx_view', view);
    renderTabs(); load();
  }));
  $('content').querySelectorAll('.ovdel').forEach(el => el.addEventListener('click', () => {
    const p = custom.find(c => c.id === el.dataset.del);
    if (!p || !confirm(`Remove ${p.name}?`)) return;
    custom = custom.filter(c => c.id !== el.dataset.del);
    localStorage.setItem('wx_custom', JSON.stringify(custom));
    localStorage.removeItem('wx2_' + el.dataset.del);
    delete cache[el.dataset.del];
    ov = null; renderTabs(); load(true);
  }));
  const add = $('addPlace');
  if (add) add.addEventListener('click', () => { adding = true; renderOverview(); $('q').focus(); });
  const go = $('qgo');
  if (go){
    const search = async () => {
      const q = $('q').value.trim(); if (!q) return;
      $('qres').innerHTML = '<div class="meta" style="margin-top:10px">Searching…</div>';
      try{
        const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=6&language=en&format=json`);
        const j = await r.json();
        const res = j.results || [];
        $('qres').innerHTML = res.length ? res.map((g, i) =>
          `<button class="gres" data-i="${i}"><b>${esc(g.name)}</b><small>${esc([g.admin1, g.country].filter(Boolean).join(', '))}</small></button>`).join('')
          : '<div class="meta" style="margin-top:10px">No matches.</div>';
        $('qres').querySelectorAll('.gres').forEach(el => el.addEventListener('click', () => {
          const g = res[+el.dataset.i];
          custom.push({ id: 'c' + Math.random().toString(36).slice(2, 8), name: g.name,
            sub: [g.admin1, g.country].filter(Boolean).join(', '), lat: g.latitude, lon: g.longitude });
          localStorage.setItem('wx_custom', JSON.stringify(custom));
          adding = false; ov = null; renderTabs(); load(true);
        }));
      }catch(err){ $('qres').innerHTML = `<div class="err" style="margin-top:10px">Search failed (${esc(err.message)}).</div>`; }
    };
    go.addEventListener('click', search);
    $('q').addEventListener('keydown', e => { if (e.key === 'Enter') search(); });
  }
}

/* ---------- single place ---------- */
async function loadPlace(force){
  const p = PLACES().find(x => x.id === view);
  $('placeName').textContent = `${p.name} · ${p.sub}`;
  const c = cache[view];
  if (c && !force && Date.now() - c.at < 20*60*1000){ render(); return; }
  if (c) render();
  if (!c) $('content').innerHTML = '<div class="meta">Loading…</div>';
  const url = 'https://api.open-meteo.com/v1/forecast'
    + `?latitude=${p.lat}&longitude=${p.lon}`
    + '&hourly=temperature_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m,wind_gusts_10m,wind_direction_10m,is_day'
    + '&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,wind_speed_10m_max,sunrise,sunset'
    + '&wind_speed_unit=ms&timezone=auto&forecast_days=10&past_days=30';
  try{
    const r = await fetch(url);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    cache[view] = { data, at: Date.now() };
    localStorage.setItem('wx2_' + view, JSON.stringify(cache[view]));
    render();
  }catch(err){
    const stored = localStorage.getItem('wx2_' + view);
    if (!cache[view] && stored){ try{ cache[view] = JSON.parse(stored); render(); }catch(e){} }
    $('msg').innerHTML = `<div class="err">Couldn't fetch fresh forecast (${esc(err.message)}). ` +
      (cache[view] ? 'Showing last saved data.' : 'Check the connection and reload.') + '</div>';
    if (!cache[view]) $('content').innerHTML = '';
  }
}

function render(){
  if (view === 'overview'){ renderOverview(); return; }
  const c = cache[view]; if (!c) return;
  const { hourly: h, daily: d } = c.data;
  $('updated').textContent = 'updated ' + new Date(c.at).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});

  const byDay = {};
  h.time.forEach((t, i) => { const day = t.slice(0, 10); (byDay[day] = byDay[day] || []).push(i); });

  const todayIdx = Math.max(0, d.time.length - 10);
  const todayStr = d.time[todayIdx];
  const open = sessionStorage.getItem('wx_open_' + view) || todayStr;
  const html = d.time.map((day, di) => {
    if (di < todayIdx) return '';
    const idx = byDay[day] || [];
    if (!idx.length) return '';
    const dt = new Date(day + 'T12:00:00');
    const dname = di === todayIdx ? 'Today' : dt.toLocaleDateString([], {weekday:'long'});
    const ddate = dt.toLocaleDateString([], {month:'short', day:'numeric'});
    const syms = [3,9,15,21].map(hr => {
      const i = idx.find(j => +h.time[j].slice(11,13) >= hr);
      return i == null ? '' : sym(h.weather_code[i], h.is_day[i])[0];
    }).join('');
    const pSum = d.precipitation_sum[di] || 0;
    const maxP = Math.max(1, ...idx.map(i => h.precipitation[i]));
    const rows = idx.map(i => {
      const hh = h.time[i].slice(11, 16);
      const [s, label] = sym(h.weather_code[i], h.is_day[i]);
      const p = h.precipitation[i] || 0;
      const barW = p > 0 ? Math.max(6, Math.round(p / maxP * 100)) : 0;
      const feels = h.apparent_temperature ? `<td class="fl">${fmtT(h.apparent_temperature[i])}</td>` : '<td class="fl">—</td>';
      return `<tr>
        <td class="hh">${hh}</td>
        <td class="sym" title="${label}">${s}</td>
        <td class="tmp ${tCls(h.temperature_2m[i])}">${fmtT(h.temperature_2m[i])}</td>
        ${feels}
        <td class="pr ${p > 0 ? '' : 'zero'}">${p > 0 ? fmtP(p) : '0'}${p > 0 ? `<span class="bar" style="right:${100 - barW}%"></span>` : ''}</td>
        <td class="wnd">${fmtW(h.wind_speed_10m[i])} <span class="gust">(${fmtW(h.wind_gusts_10m[i])})</span><span class="arr" style="transform:rotate(${(h.wind_direction_10m[i] + 180) % 360}deg)">↑</span></td>
      </tr>`;
    }).join('');
    const sun = d.sunrise ? `<div class="sunrow"><span>🌅 ${hhmm(d.sunrise[di])}</span><span>🌇 ${hhmm(d.sunset[di])}</span></div>` : '';
    return `<details class="day" data-day="${day}" ${day === open ? 'open' : ''}>
      <summary>
        <div><div class="dname">${dname}</div><div class="ddate">${ddate}</div></div>
        <div class="dsyms">${syms}</div>
        <div class="dtemps"><span class="${tCls(d.temperature_2m_max[di])}">${fmtT(d.temperature_2m_max[di])}</span> / <span class="${tCls(d.temperature_2m_min[di])}">${fmtT(d.temperature_2m_min[di])}</span></div>
        <div class="dxtra"><span class="pr">${pSum > 0 ? fmtP(pSum) + ' mm' : '0 mm'}</span><span class="wd">${fmtW(d.wind_speed_10m_max[di])} ${wUnit()}</span></div>
      </summary>
      ${sun}
      <table>
        <tr><th>Time</th><th></th><th>Temp</th><th>Feels</th><th>Precip mm</th><th>Wind (gust) ${wUnit()}</th></tr>
        ${rows}
      </table>
    </details>`;
  }).join('');
  $('content').innerHTML = html;
  $('content').querySelectorAll('details').forEach(el =>
    el.addEventListener('toggle', () => { if (el.open) sessionStorage.setItem('wx_open_' + view, el.dataset.day); }));
  renderHistory(d, todayIdx);
}

function renderHistory(d, todayIdx){
  const card = $('histCard');
  if (todayIdx < 5){ card.style.display = 'none'; return; }
  card.style.display = '';
  card.open = localStorage.getItem('wx_hist') !== '0';

  const N = todayIdx + 1;
  const days = d.time.slice(0, N);
  const hi = d.temperature_2m_max.slice(0, N).map(conv);
  const lo = d.temperature_2m_min.slice(0, N).map(conv);

  const W = 720, H = 240, ml = 38, mr = 14, mt = 14, mb = 26;
  const step = unit === 'metric' ? 5 : 10;
  const thr  = unit === 'metric' ? 30 : 86;
  const ymin = Math.floor(Math.min(...lo) / step) * step;
  let ymax = Math.ceil(Math.max(...hi) / step) * step;
  if (ymax === ymin) ymax += step;
  const x = i => ml + i / (N - 1) * (W - ml - mr);
  const y = v => mt + (ymax - v) / (ymax - ymin) * (H - mt - mb);

  let g = '';
  for (let v = ymin; v <= ymax; v += step)
    g += `<line class="gline" x1="${ml}" y1="${y(v)}" x2="${W - mr}" y2="${y(v)}"/>` +
         `<text class="glab" x="${ml - 6}" y="${y(v) + 4}" text-anchor="end">${v}°</text>`;
  for (let i = N - 1; i >= 0; i -= 7){
    const dt = new Date(days[i] + 'T12:00:00');
    const lab = i === N - 1 ? 'Today' : dt.toLocaleDateString([], {month:'short', day:'numeric'});
    g += `<text class="glab" x="${x(i)}" y="${H - 8}" text-anchor="middle">${lab}</text>`;
  }
  if (thr > ymin && thr < ymax)
    g += `<line class="thr" x1="${ml}" y1="${y(thr)}" x2="${W - mr}" y2="${y(thr)}"/>` +
         `<text class="glab" x="${W - mr}" y="${y(thr) - 4}" text-anchor="end">${thr}°</text>`;

  const path = a => a.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join('');
  g += `<path d="${path(hi)}" fill="none" stroke="var(--cwarm)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
  g += `<path d="${path(lo)}" fill="none" stroke="var(--ccold)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
  g += `<g id="hcross" style="display:none">
    <line x1="0" y1="${mt}" x2="0" y2="${H - mb}" class="gline"/>
    <circle r="4" fill="var(--cwarm)" stroke="var(--card)" stroke-width="2"/>
    <circle r="4" fill="var(--ccold)" stroke="var(--card)" stroke-width="2"/>
  </g>`;
  $('hist').innerHTML = `<svg viewBox="0 0 ${W} ${H}" id="hsvg">${g}<rect x="${ml}" y="${mt}" width="${W - ml - mr}" height="${H - mt - mb}" fill="transparent" id="hcap"/></svg>`;

  const svg = $('hsvg'), cap = $('hcap'), tip = $('htip');
  const move = ev => {
    const r = svg.getBoundingClientRect();
    const px = (ev.clientX - r.left) / r.width * W;
    const i = Math.max(0, Math.min(N - 1, Math.round((px - ml) / (W - ml - mr) * (N - 1))));
    const cr = svg.querySelector('#hcross'); cr.style.display = '';
    const [ln, c1, c2] = cr.children;
    ln.setAttribute('x1', x(i)); ln.setAttribute('x2', x(i));
    c1.setAttribute('cx', x(i)); c1.setAttribute('cy', y(hi[i]));
    c2.setAttribute('cx', x(i)); c2.setAttribute('cy', y(lo[i]));
    const dt = new Date(days[i] + 'T12:00:00');
    tip.innerHTML = `<b>${dt.toLocaleDateString([], {weekday:'short', month:'short', day:'numeric'})}</b><br>High ${Math.round(hi[i])}° · Low ${Math.round(lo[i])}°`;
    tip.style.display = 'block';
    const wrap = tip.parentElement.getBoundingClientRect();
    let tx = (x(i) / W) * r.width + 12;
    if (tx + tip.offsetWidth > wrap.width - 8) tx = (x(i) / W) * r.width - tip.offsetWidth - 12;
    tip.style.left = tx + 'px';
    tip.style.top = Math.max(4, (y(hi[i]) / H) * r.height - 14) + 'px';
  };
  cap.addEventListener('pointermove', move);
  cap.addEventListener('pointerdown', move);
  cap.addEventListener('pointerleave', () => { tip.style.display = 'none'; svg.querySelector('#hcross').style.display = 'none'; });
}
$('histCard').addEventListener('toggle', () => localStorage.setItem('wx_hist', $('histCard').open ? '1' : '0'));

try{ const s = localStorage.getItem('wx_ov'); if (s) ov = JSON.parse(s); }catch(e){}

document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
setInterval(() => { if (!document.hidden) load(); }, 30*60*1000);
