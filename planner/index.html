<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Truck Planner</title>
  <!-- v2.0 — sheet-style truck grid: 3-wide rows, Front of Truck at top, rear door at bottom -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f2f5; color: #1a1a2e; min-height: 100vh;
      -webkit-user-select: none; user-select: none;
    }

    /* ---- top bar ---- */
    .bar {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      background: #1a1a2e; color: #fff; padding: 12px 16px;
      position: sticky; top: 0; z-index: 30;
    }
    .bar h1 { font-size: 18px; font-weight: 700; margin-right: auto; }
    .bar .day { font-size: 14px; color: #b9c0d0; font-weight: 500; }
    .bar input[type=date] { font-size: 14px; padding: 7px 9px; border-radius: 8px; border: none; }
    .bar button {
      font-size: 14px; font-weight: 600; padding: 9px 14px; border: none;
      border-radius: 8px; cursor: pointer; color: #fff; background: #3a4a7a;
    }
    .bar button.save { background: #1e9e5a; }
    .bar button.danger { background: #8a3040; }
    .bar button:active { opacity: .8; }
    #status { font-size: 13px; color: #b9c0d0; min-width: 70px; }

    /* ---- layout ---- */
    .panels { display: flex; gap: 14px; padding: 14px; align-items: flex-start; }
    @media (max-width: 900px) { .panels { flex-direction: column; } .panels > .panel { width: 100%; } }
    .panel {
      flex: 1; background: #fff; border-radius: 14px; padding: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
    }
    .panel-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
    .panel-head .title { font-size: 17px; font-weight: 700; }
    .panel-head .start { font-size: 13px; color: #6b7280; }
    .panel-head .tot { margin-left: auto; font-size: 13px; color: #374151; font-weight: 600; }
    .panel-head button {
      font-size: 13px; font-weight: 600; padding: 7px 11px; border: none;
      border-radius: 8px; cursor: pointer; color: #fff; background: #3a4a7a;
    }
    .panel-head button:active { opacity: .8; }

    /* ---- stop order list ---- */
    .stops { margin-bottom: 10px; }
    .stops .hd { font-size: 11px; font-weight: 700; color: #9098a8; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; }
    .stoprow { display: flex; align-items: center; gap: 8px; padding: 4px 2px; border-bottom: 1px solid #f0f2f5; }
    .stoprow .num { width: 20px; text-align: right; font-size: 12px; font-weight: 700; color: #9098a8; }
    .stoprow .snm {
      flex: 1; font-size: 13.5px; font-weight: 600; padding: 4px 8px; border-radius: 6px;
      color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer;
    }
    .stoprow .badges { font-size: 12px; color: #4b5563; font-weight: 600; white-space: nowrap; }
    .stoprow .mv {
      width: 34px; height: 30px; border: none; border-radius: 7px; cursor: pointer;
      background: #e6e9f0; color: #374151; font-size: 14px; font-weight: 700;
    }
    .stoprow .mv:active { background: #c8cdd8; }
    .stops .note { font-size: 11.5px; color: #9098a8; margin-top: 4px; }
    .stops .addstop {
      font-size: 12.5px; font-weight: 600; padding: 6px 10px; margin-top: 6px;
      border: 1px dashed #9098a8; border-radius: 8px; cursor: pointer;
      color: #374151; background: transparent;
    }
    .stops .addstop:active { opacity: .7; }

    /* ---- print sheet (B/W, all trucks side by side on ONE page) ---- */
    #printArea { display: none; }
    @media print {
      body > .bar, #root, #pop { display: none !important; }
      body { background: #fff; }
      #printArea { display: flex; gap: 14pt; align-items: flex-start; }
      #printArea .page { flex: 1 1 0; min-width: 0; padding: 0; color: #000; font-family: Arial, sans-serif; page-break-inside: avoid; }
      #printArea h2 { font-size: 13pt; margin: 0 0 2pt; }
      #printArea .sub { font-size: 8pt; margin: 0 0 6pt; color: #000; }
      #printArea table { border-collapse: collapse; width: 100%; }
      #printArea .stops-t { margin-bottom: 8pt; }
      #printArea .stops-t th, #printArea .stops-t td { border: 1pt solid #000; padding: 2pt 4pt; font-size: 8.5pt; text-align: left; }
      #printArea .truck-t { table-layout: fixed; }
      #printArea .truck-t td { border: 1pt solid #000; padding: 3pt 1pt; font-size: 8pt; text-align: center; height: 15pt; overflow: hidden; }
      #printArea .truck-t td.filled { background: #eee; font-weight: 700; }
      #printArea .truck-t td.barrow { border: 1pt solid #000; background: #555; color: #fff; font-weight: 700; font-size: 6.5pt; height: 8pt; padding: 0; text-align: center; }
      #printArea .truck-t .cap { border: 1pt solid #000; background: #000; color: #fff; font-weight: 700; font-size: 8pt; padding: 2pt; text-align: center; }
      #printArea .unplaced-note { font-size: 8pt; margin-top: 6pt; }
    }
    #pop .addc {
      display: block; width: 100%; text-align: left; font-size: 13.5px; font-weight: 600;
      padding: 8px 10px; margin-top: 6px; border: none; border-radius: 8px;
      cursor: pointer; color: #fff;
    }
    #pop .mvrun {
      display: block; width: 100%; text-align: left; font-size: 13.5px; font-weight: 700;
      padding: 8px 10px; margin-top: 8px; border: 1px dashed rgba(255,255,255,.45); border-radius: 8px;
      cursor: pointer; color: #fff; background: rgba(255,255,255,.12);
    }
    #pop .mvrun:active { opacity: .7; }

    /* ---- tray ---- */
    .tray {
      min-height: 46px; border: 2px dashed #c8cdd8; border-radius: 10px;
      padding: 6px; margin-bottom: 10px; display: flex; flex-wrap: wrap; gap: 6px;
      align-content: flex-start;
    }
    .tray .lbl {
      width: 100%; font-size: 11px; font-weight: 700; color: #9098a8;
      text-transform: uppercase; letter-spacing: .04em; margin-bottom: 2px;
    }
    .tray.drop-hot { border-color: #3a4a7a; background: #eef1fb; }
    .tray .tile { flex: 0 0 auto; }

    /* ---- truck ---- */
    .truck {
      border: 3px solid #3a4152; border-radius: 14px; overflow: hidden; background: #fafbfc;
    }
    .truck .cap {
      text-align: center; font-size: 11px; font-weight: 800; letter-spacing: .12em;
      text-transform: uppercase; color: #fff; background: #3a4152; padding: 5px 0;
    }
    .trow {
      display: grid; gap: 6px; padding: 5px 6px; min-height: 42px;
      border-bottom: 1px dashed #e2e5ec; align-items: stretch;
    }
    .trow:last-of-type { border-bottom: none; }
    .trow.drop-hot { background: #eef1fb; box-shadow: inset 0 0 0 2px #3a4a7a; border-radius: 4px; }
    .trow.reject { background: #fbeaea; box-shadow: inset 0 0 0 2px #c0392b; }
    .trow.div-above { box-shadow: inset 0 4px 0 0 #3a4152; }
    .trow.div-below { box-shadow: inset 0 -4px 0 0 #3a4152; }

    .divider {
      background: #3a4152; color: #fff; text-align: center; font-size: 10px; font-weight: 800;
      letter-spacing: .18em; padding: 3px 0; border-radius: 3px; margin: 1px 6px; cursor: pointer;
    }
    .divider:active { opacity: .7; }

    .tile {
      touch-action: none; cursor: grab;
      padding: 7px 9px; border-radius: 9px; color: #fff; font-size: 12.5px; font-weight: 600;
      box-shadow: 0 1px 2px rgba(0,0,0,.15); line-height: 1.15;
      display: flex; align-items: center; gap: 5px; min-height: 32px; overflow: hidden;
    }
    .tile .ty {
      font-size: 9.5px; font-weight: 800; letter-spacing: .05em; padding: 2px 4px;
      border-radius: 4px; background: rgba(255,255,255,.25); flex: 0 0 auto;
    }
    .tile.t-pallet, .tile.t-bin { border: 2px dashed rgba(255,255,255,.65); }
    .tile.t-bar { background: #3a4152 !important; justify-content: center; letter-spacing: .1em; }
    .tile.dragging { opacity: .35; }
    .tile.ghost {
      position: fixed; z-index: 100; pointer-events: none; opacity: .92;
      box-shadow: 0 6px 18px rgba(0,0,0,.3); transform: scale(1.05);
    }

    /* ---- popover ---- */
    #pop {
      position: fixed; z-index: 200; width: 300px; max-width: calc(100vw - 16px);
      background: #1a1a2e; color: #fff; font-size: 13px; line-height: 1.4;
      padding: 12px; border-radius: 12px; box-shadow: 0 6px 24px rgba(0,0,0,.4); display: none;
    }
    #pop b { display: block; margin-bottom: 8px; font-size: 14px; }
    #pop .urow { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    #pop .urow .ulbl { flex: 1; color: #cfd6e6; font-weight: 600; }
    #pop .urow button {
      width: 34px; height: 32px; border: none; border-radius: 8px; cursor: pointer;
      background: rgba(255,255,255,.18); color: #fff; font-size: 17px; font-weight: 700;
    }
    #pop .urow .uc { min-width: 22px; text-align: center; font-weight: 700; }
    #pop .rcv { margin-top: 8px; border-top: 1px solid rgba(255,255,255,.15); padding-top: 6px; }
    #pop .row { color: #cfd6e6; font-size: 12px; }
    .empty { padding: 40px 16px; text-align: center; color: #6b7280; font-size: 15px; }
  </style>
</head>
<body>
  <div class="bar">
    <h1>Truck Planner</h1>
    <span class="day" id="dayLabel"></span>
    <input type="date" id="datePick">
    <button id="refreshBtn">Refresh</button>
    <button id="printBtn">Print</button>
    <button class="danger" id="resetBtn">Reset day</button>
    <button class="save" id="saveBtn">Save</button>
    <span id="status"></span>
  </div>
  <div id="root"><div class="empty">Loading…</div></div>
  <div id="printArea"></div>
  <div id="pop"></div>

<script>
// ===== backend =====
var BACKEND_URL = 'https://script.google.com/macros/s/AKfycby28VVrPqOHYAVbROXipODf0lkNp5skNwxp8rZnT1wUGyvQsUb1Lpsfb5nAdmgxGEKfqg/exec';
function call(op, payload) {
  return fetch(BACKEND_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ op: op, payload: payload || {} }),
    redirect: 'follow'
  }).then(function (r) { return r.json(); });
}

// ===== state =====
// We only plan John's and Randy's FIRST runs; second runs the drivers load themselves.
// The truck is a grid: TRUCK_ROWS rows of up to 3 spots each. rows[0] = Front of Truck (nose,
// last stop), rows[TRUCK_ROWS-1] = rear door (first stop, unloads first).
// Row capacity is measured in half-spots (6 per row): basic rack = 2 (one spot), wide rack =
// 3 (1.5 spots — Will, 2026-08-05), pallet/bin = 3, load bar takes the full row.
var TRUCK_ROWS = 8;   // truck fits no more than 8 rows of racks (Will, 2026-07-27)
var TYPES = ['rack', 'wide', 'pallet', 'bin'];
var TYPE_LABEL = { rack: 'Racks', wide: 'Wide racks', pallet: 'Pallets', bin: 'Bins/crates' };
var TYPE_TAG = { wide: 'WIDE', pallet: 'PLT', bin: 'BIN', bar: '' };

var serviceDate = '';
var board = {};      // runKey -> { label, start, customers:{name->{short,color,received,units}}, stops:[], tray:[], rows:[[]] }
var runOrder = [];
var tileSeq = 0;
var saveTimer = null, stopsTimer = null, stopsDirty = {};

function setStatus(s) { document.getElementById('status').textContent = s || ''; }
function colorFor(name) {
  var h = 0; for (var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
  return 'hsl(' + (h % 360) + ',55%,42%)';
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function fmtTime(t) {
  if (!t) return '';
  var p = t.split(':'); var h = parseInt(p[0], 10); var ap = h >= 12 ? 'PM' : 'AM';
  return ((h + 11) % 12) + 1 + ':' + p[1] + ' ' + ap;
}
function isSpecial(t) { return t.type === 'wide' || t.type === 'pallet' || t.type === 'bin'; }
// Width in half-spots: basic rack = 1 spot, wide rack = 1.5 spots, pallet/bin = 1.5 spots.
var ROW_HALVES = 6;
function tileW(t) { return t.type === 'rack' ? 2 : 3; }
function rowUsed(rowArr) {
  var u = 0; for (var i = 0; i < rowArr.length; i++) u += tileW(rowArr[i]); return u;
}

// Can `tile` be added to a row already holding rowArr? (Load bars never live in rows —
// they snap BETWEEN rows as dividers.)
function canDrop(rowArr, tile) {
  if (tile.type === 'bar') return false;
  return rowUsed(rowArr) + tileW(tile) <= ROW_HALVES;
}

// Lay a row out in half-spot columns (1..ROW_HALVES). Tiles the crew has dropped on a
// side keep it (pos 'L'/'M'/'R'); everything else uses the defaults: racks & wides pack
// left, pallets & bins ride flush right by the door-side wall, and a row of exactly two
// basic racks leaves the middle open for balance. Returns [{t, col}] sorted by col.
function layoutRow(row) {
  var L = [], M = [], R = [];
  var auto = row.filter(function (t) { return !t.pos; });
  var twoRacks = auto.length === row.length && row.length === 2 &&
                 row[0].type === 'rack' && row[1].type === 'rack';
  row.forEach(function (t, i) {
    if (t.pos === 'L') L.push(t);
    else if (t.pos === 'M') M.push(t);
    else if (t.pos === 'R') R.push(t);
    else if (twoRacks) (i === 0 ? L : R).push(t);
    else if (t.type === 'pallet' || t.type === 'bin') R.push(t);
    else L.push(t);
  });
  var out = [], col = 1;
  L.forEach(function (t) { out.push({ t: t, col: col }); col += tileW(t); });
  var lw = col - 1;
  var rw = 0; R.forEach(function (t) { rw += tileW(t); });
  var mw = 0; M.forEach(function (t) { mw += tileW(t); });
  var mcol = Math.floor((ROW_HALVES - mw) / 2) + 1;
  mcol = Math.max(lw + 1, Math.min(mcol, ROW_HALVES - rw - mw + 1));
  M.forEach(function (t) { out.push({ t: t, col: mcol }); mcol += tileW(t); });
  var rcol = ROW_HALVES - rw + 1;
  R.forEach(function (t) { out.push({ t: t, col: rcol }); rcol += tileW(t); });
  out.sort(function (a, b) { return a.col - b.col; });
  return out;
}

// ===== load =====
function load(dateOverride) {
  setStatus('loading…');
  document.getElementById('root').innerHTML = '<div class="empty">Loading…</div>';
  call('plan', dateOverride ? { date: dateOverride } : {}).then(function (d) {
    if (!d || !d.ok) { document.getElementById('root').innerHTML = '<div class="empty">Error: ' + ((d && d.error) || 'no data') + '</div>'; setStatus(''); return; }
    serviceDate = d.serviceDate;
    document.getElementById('dayLabel').textContent = d.serviceDayName + ' ' + d.serviceDate;
    document.getElementById('datePick').value = d.serviceDate;
    buildBoard(d);
    render();
    setStatus('');
  }).catch(function () {
    document.getElementById('root').innerHTML = '<div class="empty">Network error. Tap Refresh.</div>'; setStatus('');
  });
}

function mkTile(customer, type, pos) { var t = { id: ++tileSeq, customer: customer, type: type }; if (pos) t.pos = pos; return t; }
function isProMfg(nm) { return /^pro[\s.-]*m(fg|anufacturing)/.test(String(nm || '').toLowerCase()); }

function buildBoard(d) {
  board = {}; runOrder = [];
  var firstRuns = (d.runs || []).filter(function (r) { return /1|first/i.test(r.run); });
  var saved = d.arrangement && d.arrangement.arrangement;
  var savedV2 = saved && saved.v === 2 && saved.runs;

  firstRuns.forEach(function (r) {
    var custs = {};
    var routed = {};   // customers the backend routes to THIS run (their "home" truck)
    var fresh = false;
    r.customers.forEach(function (c) {
      routed[c.name] = 1;
      custs[c.name] = { short: c.shortName || c.name, color: colorFor(c.name),
                        received: c.received || [], pickups: c.pickups || [],
                        units: c.units || { rack: c.rackCount || 0, wide: 0, pallet: 0, bin: 0 } };
    });
    var tray = [];
    var rows = []; for (var i = 0; i < TRUCK_ROWS; i++) rows.push([]);

    function ensureCust(nm) {
      if (!custs[nm]) custs[nm] = { short: nm, color: colorFor(nm), received: [], pickups: [], units: { rack: 0, wide: 0, pallet: 0, bin: 0 }, stub: true };
    }

    // Pickup-only stops: customer's racks were sent on the OTHER truck this day, but
    // this (home) truck still stops there to pick up. Persisted in the day's save.
    var puOnly = (savedV2 && saved.runs[r.key] && saved.runs[r.key].puOnly) || {};

    var dividers = (savedV2 && saved.runs[r.key] && saved.runs[r.key].dividers) || [];
    dividers = dividers.filter(function (i) { return i >= 0 && i <= TRUCK_ROWS; });

    if (savedV2 && saved.runs[r.key]) {
      var sv = saved.runs[r.key];
      (sv.tray || []).forEach(function (t) {
        if (t.type === 'bar') { tray.push(mkTile('', 'bar')); return; }
        ensureCust(t.customer); tray.push(mkTile(t.customer, t.type || 'rack', t.pos));
      });
      (sv.rows || []).forEach(function (rw, ri) {
        rw.forEach(function (t) {
          // legacy saves kept load bars as full-row tiles — convert to a divider here
          if (t.type === 'bar') { if (dividers.indexOf(ri) === -1) dividers.push(Math.min(ri, TRUCK_ROWS)); return; }
          ensureCust(t.customer);
          var tile = mkTile(t.customer, t.type || 'rack', t.pos);
          if (ri < TRUCK_ROWS) rows[ri].push(tile); else tray.push(tile);
        });
      });
    } else {
      // seed tiles from typed receiving counts into the tray; auto-placed after build
      fresh = true;
      r.customers.forEach(function (c) {
        var u = custs[c.name].units;
        TYPES.forEach(function (ty) { for (var i = 0; i < (u[ty] || 0); i++) tray.push(mkTile(c.name, ty)); });
      });
    }

    // Only customers with racks on hand (tiles) show as stops — zero-count route
    // customers cluttered every run. They stay one tap away via "+ Add customer".
    var tiled = {};
    tray.forEach(function (t) { if (t.customer) tiled[t.customer] = 1; });
    rows.forEach(function (rw) { rw.forEach(function (t) { if (t.customer) tiled[t.customer] = 1; }); });
    // A customer with an open pickup request is a stop even with zero racks going out —
    // the driver needs to see "PU" on the sheet (space on the return trip).
    Object.keys(custs).forEach(function (nm) { if ((custs[nm].pickups || []).length) tiled[nm] = 1; });
    // Pickup-only stops (racks sent on the other truck) stay visible the same way.
    Object.keys(puOnly).forEach(function (nm) { if (custs[nm]) tiled[nm] = 1; });

    // stop order: remembered order first (kept only if still known), then anyone new
    var stops = (r.stops || []).filter(function (nm) { return custs[nm] && tiled[nm]; });
    Object.keys(custs).forEach(function (nm) { if (tiled[nm] && stops.indexOf(nm) === -1) stops.push(nm); });
    // Pro Manufacturing is always the first stop (first off the truck — its racks
    // land at the door end of the rack block, mid-truck).
    for (var pi = 1; pi < stops.length; pi++) {
      if (isProMfg(stops[pi])) { stops.unshift(stops.splice(pi, 1)[0]); break; }
    }
    var hidden = Object.keys(custs).filter(function (nm) { return !tiled[nm]; }).sort();

    board[r.key] = { label: r.label, start: r.start, customers: custs, stops: stops, hidden: hidden, tray: tray, rows: rows, fresh: fresh, routed: routed, puOnly: puOnly, dividers: dividers };
    runOrder.push(r.key);
  });

  // Hydrate moved-in customers: a saved cross-truck move leaves stub entries (no counts,
  // no receiving detail) on the target run — borrow the full record from the home run.
  runOrder.forEach(function (rk) {
    var b = board[rk];
    Object.keys(b.customers).forEach(function (nm) {
      if (!b.customers[nm].stub) return;
      runOrder.forEach(function (rk2) {
        if (rk2 !== rk && board[rk2].customers[nm] && !board[rk2].customers[nm].stub) b.customers[nm] = board[rk2].customers[nm];
      });
    });
  });

  // Prepopulate the truck on a fresh seed: run the auto-loader so the spots start
  // filled per the algorithm (stop order, wide/pallet rules); crew adjusts from there.
  runOrder.forEach(function (rk) {
    if (board[rk].fresh) autoLoad(rk);
  });
}

// ===== render =====
function tileCountAll(b) {
  var n = b.tray.length;
  b.rows.forEach(function (r) { n += r.length; });
  return n;
}
function otherRun(rk) {
  if (runOrder.length !== 2) return null;
  return runOrder[0] === rk ? runOrder[1] : runOrder[0];
}
function tileCountFor(rk, nm) {
  var n = 0, b = board[rk];
  function bump(t) { if (t.customer === nm && t.type !== 'bar') n++; }
  b.tray.forEach(bump); b.rows.forEach(function (r) { r.forEach(bump); });
  return n;
}
// Move ALL of a customer's tiles from one truck to the other (e.g. ESC Plymouth rides
// John's truck, but Randy — its home route — still stops there to pick up: the home
// run keeps a numbered PU-only stop, like the crew sheet's "ESC Plymouth  PU").
function moveCustomer(from, to, nm) {
  var bf = board[from], bt = board[to];
  var moved = [];
  bf.tray = bf.tray.filter(function (t) { if (t.customer === nm) { moved.push(t); return false; } return true; });
  bf.rows = bf.rows.map(function (r) { return r.filter(function (t) { if (t.customer === nm) { moved.push(t); return false; } return true; }); });
  moved.forEach(function (t) { bt.tray.push(t); });
  if (!bt.customers[nm]) bt.customers[nm] = bf.customers[nm];
  delete bt.puOnly[nm];
  bt.hidden = (bt.hidden || []).filter(function (n) { return n !== nm; });
  if (bt.stops.indexOf(nm) === -1) bt.stops.push(nm);
  if (bf.routed[nm]) {
    bf.puOnly[nm] = 1;                       // home truck still stops there: pickup only
    if (bf.stops.indexOf(nm) === -1) bf.stops.push(nm);
  } else {
    delete bf.puOnly[nm];                    // moving back — drop the temporary stop
    bf.stops = bf.stops.filter(function (n) { return n !== nm; });
  }
  closePop();
  render(); scheduleSave(); scheduleStopsSave(from); scheduleStopsSave(to);
}

function unitSummary(rk, nm) {
  var counts = { rack: 0, wide: 0, pallet: 0, bin: 0 }, b = board[rk];
  if (b.puOnly[nm]) return 'PU';   // racks ride the other truck; this stop is pickup only
  function bump(t) { if (t.customer === nm && counts[t.type] != null) counts[t.type]++; }
  b.tray.forEach(bump); b.rows.forEach(function (r) { r.forEach(bump); });
  var parts = [];
  if (counts.rack) parts.push(counts.rack + 'R');
  if (counts.wide) parts.push(counts.wide + 'W');
  if (counts.pallet) parts.push(counts.pallet + 'P');
  if (counts.bin) parts.push(counts.bin + 'B');
  var ride = (b.customers[nm].units || {}).binRide;
  if (ride) parts.push('+' + ride + 'B on racks');
  var pk = b.customers[nm].pickups || [];
  if (pk.length) parts.push('PU' + (pk.some(function (p) { return p.status === 'OVERDUE'; }) ? ' ⚠' : ''));
  return parts.length ? parts.join(' ') : 'PU';
}

function tileHtml(rk, t, styleExtra) {

function rowHtml(rk, ri) {

// ===== auto-load =====
// Lay the truck out by the rules: first stop at the rear door filling upward, 3 across for
// basic racks (1 spot each), wide racks / pallets / bins take 1.5 spots, pallets & bins first
// at the door (right side), load bars back to the tray for the crew to place.
function autoLoad(rk) {
  var b = board[rk];
  var all = b.tray.slice();
  b.rows.forEach(function (r) { r.forEach(function (t) { all.push(t); }); });
  var bars = all.filter(function (t) { return t.type === 'bar'; });
  var byCust = {};
  all.forEach(function (t) {
    if (t.type === 'bar') return;
    (byCust[t.customer] = byCust[t.customer] || []).push(t);
  });
  var order = b.stops.filter(function (nm) { return byCust[nm]; });
  Object.keys(byCust).forEach(function (nm) { if (order.indexOf(nm) === -1) order.push(nm); });

  var rows = []; for (var i = 0; i < TRUCK_ROWS; i++) rows.push([]);
  var tray = bars.slice();

  // pallets & bins: one per row from the door up (render pushes them right)
  var pr = TRUCK_ROWS - 1;
  order.forEach(function (nm) {
    byCust[nm].filter(function (t) { return t.type === 'pallet' || t.type === 'bin'; }).forEach(function (t) {
      if (pr >= 0) rows[pr--].push(t); else tray.push(t);
    });
  });

  // racks & wides: packed flush against the FRONT wall so they strap to it (Will,
  // 2026-07-27) — last stop goes at the nose, then each earlier stop behind it, so
  // unload order at the rear door still matches the route. Any slack ends up by the
  // door, not at the front.
  var cur = 0;
  order.slice().reverse().forEach(function (nm) {
    var items = byCust[nm].filter(function (t) { return t.type === 'rack' || t.type === 'wide'; });
    items.sort(function (a, b) { return (a.type === 'wide' ? 0 : 1) - (b.type === 'wide' ? 0 : 1); });
    items.forEach(function (t) {
      while (cur < TRUCK_ROWS && !canDrop(rows[cur], t)) cur++;
      if (cur >= TRUCK_ROWS) { tray.push(t); return; }
      rows[cur].push(t);
    });
  });

  b.rows = rows; b.tray = tray;
  render(); scheduleSave();
}

// ===== count editing (popover) =====
var popCtx = null; // {rk, nm}
function openPop(rk, nm, x, y) {
  popCtx = { rk: rk, nm: nm };

  pop.style.display = 'block';

  pop.style.top = Math.max(8, Math.min(y + 14, window.innerHeight - h - 8)) + 'px';
}
function renderPop() {
  if (!popCtx) return;
  var b = board[popCtx.rk], cu = b.customers[popCtx.nm];
  var counts = { rack: 0, wide: 0, pallet: 0, bin: 0 };
  function bump(t) { if (t.customer === popCtx.nm && counts[t.type] != null) counts[t.type]++; }
  b.tray.forEach(bump); b.rows.forEach(function (r) { r.forEach(bump); });
  var h = '<b>' + esc(popCtx.nm) + '</b>';
  TYPES.forEach(function (ty) {
    h += '<div class="urow"><span class="ulbl">' + TYPE_LABEL[ty] + '</span>'
       + '<button class="pm" data-ty="' + ty + '" data-d="-1">–</button>'

  });
  if ((cu.units || {}).binRide) {
    h += '<div class="row" style="margin-top:4px"><b>' + cu.units.binRide + ' bin' + (cu.units.binRide > 1 ? 's' : '') + ' ride on the racks</b> — no truck spot needed.</div>';
  }
  // Cross-truck: send this customer's racks on the other truck (home run keeps a PU stop),
  // or bring them back if they were sent over.
  var ork = otherRun(popCtx.rk);
  if (ork) {
    var here = tileCountFor(popCtx.rk, popCtx.nm), there = tileCountFor(ork, popCtx.nm);
    if (b.puOnly[popCtx.nm]) {
      h += '<div class="row" style="margin-top:4px"><b>Pickup-only stop</b> — racks ride ' + esc(board[ork].label) + '.</div>';
    }
    if (here > 0) {
      h += '<button class="mvrun" data-from="' + esc(popCtx.rk) + '" data-to="' + esc(ork) + '" data-nm="' + esc(popCtx.nm) + '">→ Send racks on ' + esc(board[ork].label) + '</button>';
    } else if (there > 0) {
      h += '<button class="mvrun" data-from="' + esc(ork) + '" data-to="' + esc(popCtx.rk) + '" data-nm="' + esc(popCtx.nm) + '">← Bring racks back to this truck</button>';
    }
  }
  (cu.pickups || []).forEach(function (p) {
    h += '<div class="row" style="margin-top:4px"><b>📦 Pickup'
       + (p.status === 'OVERDUE' ? ' — OVERDUE' : '')
       + (p.pickupDay ? ' (' + esc(p.pickupDay) + ')' : '') + ':</b> '
       + esc(p.summary || 'requested') + '</div>';
  });
  var rows = (cu.received || []).map(function (r) { return '<div class="row">' + esc(r.date) + ' &middot; ' + esc(r.desc) + '</div>'; }).join('');
  h += '<div class="rcv">' + (rows || '<div class="row">No receiving detail.</div>') + '</div>';
  document.getElementById('pop').innerHTML = h;
}
function closePop() { document.getElementById('pop').style.display = 'none'; popCtx = null; }
function adjType(rk, nm, ty, delta) {
  var b = board[rk];
  if (delta > 0) { b.tray.push(mkTile(nm, ty)); }
  else {
    var removed = false;
    for (var i = b.tray.length - 1; i >= 0 && !removed; i--) {
      if (b.tray[i].customer === nm && b.tray[i].type === ty) { b.tray.splice(i, 1); removed = true; }
    }
    for (var ri = 0; ri < TRUCK_ROWS && !removed; ri++) {
      var arr = b.rows[ri];
      for (var j = arr.length - 1; j >= 0 && !removed; j--) {
        if (arr[j].customer === nm && arr[j].type === ty) { arr.splice(j, 1); removed = true; }
      }
    }
    if (!removed) return;
  }
  render(); renderPop(); scheduleSave();
}

// ===== drag (pointer-based: mouse + touch/iPad) =====
var drag = null;
function bindTiles() {
  document.querySelectorAll('.tile').forEach(function (el) { el.addEventListener('pointerdown', onDown); });
}
function findTile(id) {
  for (var ri = 0; ri < runOrder.length; ri++) {
    var rk = runOrder[ri], b = board[rk];
    for (var i = 0; i < b.tray.length; i++) if (b.tray[i].id === id) return { rk: rk, where: 'tray', idx: i, tile: b.tray[i] };
    for (var r = 0; r < TRUCK_ROWS; r++) {
      for (var j = 0; j < b.rows[r].length; j++) if (b.rows[r][j].id === id) return { rk: rk, where: r, idx: j, tile: b.rows[r][j] };
    }
  }
  return null;
}
function onDown(e) {
  if (e.button != null && e.button !== 0) return;
  var el = e.currentTarget;
  var id = parseInt(el.getAttribute('data-id'), 10);
  var run = el.getAttribute('data-run');
  var startX = e.clientX, startY = e.clientY, started = false;
  closePop();
  el.setPointerCapture(e.pointerId);
  function move(ev) {
    if (!started) {
      if (Math.abs(ev.clientX - startX) < 6 && Math.abs(ev.clientY - startY) < 6) return;
      started = true; begin(el, id, run, ev);
    }
    drag.ghost.style.left = (ev.clientX - drag.dx) + 'px';
    drag.ghost.style.top = (ev.clientY - drag.dy) + 'px';
    hot(ev.clientX, ev.clientY);
    ev.preventDefault();
  }
  function up(ev) {
    try { el.releasePointerCapture(e.pointerId); } catch (x) {}
    el.removeEventListener('pointermove', move); el.removeEventListener('pointerup', up); el.removeEventListener('pointercancel', up);
    if (started) finish();
    else { // tap: show the customer editor for this tile's customer
      var t = findTile(id);
      if (t && t.tile.type !== 'bar') openPop(run, t.tile.customer, ev.clientX, ev.clientY);
    }
  }
  el.addEventListener('pointermove', move); el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
}
function begin(el, id, run, ev) {
  var r = el.getBoundingClientRect();
  var g = el.cloneNode(true); g.className = el.className + ' ghost'; g.style.gridColumn = '';
  g.style.width = Math.min(r.width, 220) + 'px';
  document.body.appendChild(g);
  el.classList.add('dragging');
  var src = findTile(id);
  drag = { id: id, run: run, ghost: g, dx: ev.clientX - r.left, dy: ev.clientY - r.top,
           hotEl: null, isBar: !!(src && src.tile.type === 'bar'), lastX: ev.clientX, lastY: ev.clientY, divAt: null };
}
function clearHot() {
  if (!drag.hotEl) return;
  drag.hotEl.classList.remove('drop-hot', 'div-above', 'div-below');
  drag.hotEl = null;
}
function hot(x, y) {
  drag.lastX = x; drag.lastY = y;
  var el = document.elementFromPoint(x, y);
  var target = el && el.closest ? el.closest('.trow, .tray') : null;
  if (target && target.getAttribute('data-run') !== drag.run) target = null; // stay within the run
  if (drag.hotEl && drag.hotEl !== target) clearHot();
  drag.hotEl = target;
  if (!target) return;
  if (drag.isBar && target.classList.contains('trow')) {
    // a load bar snaps BETWEEN rows: highlight the nearer boundary of the hovered row
    var r = target.getBoundingClientRect();
    var above = y < r.top + r.height / 2;
    drag.divAt = parseInt(target.getAttribute('data-row'), 10) + (above ? 0 : 1);
    target.classList.remove(above ? 'div-below' : 'div-above');
    target.classList.add(above ? 'div-above' : 'div-below');
  } else {
    target.classList.add('drop-hot');
  }
}
function finish() {
  var src = findTile(drag.id);
  var target = drag.hotEl;
  var ok = false;
  if (src && target) {
    var b = board[src.rk];
    if (target.classList.contains('tray')) {
      if (!(drag.isBar && src.where === 'tray')) {
        removeAt(b, src);
        delete src.tile.pos;   // back in the tray = no chosen side
        b.tray.push(src.tile);
        ok = true;
      }
    } else if (drag.isBar) {
      // snap the load bar in as a divider at the highlighted boundary
      if (drag.divAt != null) {
        removeAt(b, src);
        if (b.dividers.indexOf(drag.divAt) === -1) b.dividers.push(drag.divAt);
        ok = true;
      }
    } else {
      var ri = parseInt(target.getAttribute('data-row'), 10);
      var rowArr = b.rows[ri];
      var sameRow = (src.where === ri);
      var check = sameRow ? rowArr.filter(function (t) { return t.id !== src.tile.id; }) : rowArr;
      if (canDrop(check, src.tile)) {
        removeAt(b, src);
        // remember which side of the row the crew dropped it on (left / middle / right)
        var r = target.getBoundingClientRect();
        var f = (drag.lastX - r.left) / r.width;
        src.tile.pos = f < 0.34 ? 'L' : (f < 0.66 ? 'M' : 'R');
        b.rows[ri].push(src.tile);
        ok = true;
      } else {
        target.classList.add('reject');
        (function (tEl) { setTimeout(function () { tEl.classList.remove('reject'); }, 450); })(target);
      }
    }
  }
  if (drag.hotEl) clearHot();
  if (drag.ghost) drag.ghost.remove();
  drag = null;
  render();
  if (ok) scheduleSave();
}
function removeAt(b, src) {
  if (src.where === 'tray') b.tray.splice(src.idx, 1);
  else b.rows[src.where].splice(src.idx, 1);
}

// ===== save =====
function slim(t) { var o = { customer: t.customer, type: t.type }; if (t.pos) o.pos = t.pos; return o; }
function arrangement() {
  var out = { v: 2, runs: {} };
  runOrder.forEach(function (rk) {
    var b = board[rk];
    out.runs[rk] = {
      tray: b.tray.map(slim),
      rows: b.rows.map(function (r) { return r.map(slim); }),
      puOnly: b.puOnly,
      dividers: b.dividers
    };
  });
  return out;
}
function scheduleSave() { clearTimeout(saveTimer); setStatus('…'); saveTimer = setTimeout(doSave, 1200); }
function doSave() {
  setStatus('saving…');
  call('save', { serviceDate: serviceDate, arrangement: arrangement() }).then(function (d) {
    setStatus(d && d.ok ? 'saved ✓' : 'save failed');
  }).catch(function () { setStatus('save failed'); });
}
function scheduleStopsSave(rk) {
  stopsDirty[rk] = true;
  clearTimeout(stopsTimer);
  stopsTimer = setTimeout(function () {
    Object.keys(stopsDirty).forEach(function (k) {
      call('saveStops', { runKey: k, stops: board[k].stops });
    });
    stopsDirty = {};
  }, 1000);
}

// Print: compose a B/W paper sheet per truck — stop order + truck diagram — then
// hand off to the browser's print dialog (@media print shows only #printArea).
function buildPrintSheet() {
  var day = document.getElementById('dayLabel').textContent;
  var html = '';
  runOrder.forEach(function (rk) {
    var b = board[rk];
    html += '<div class="page">';
    html += '<h2>' + esc(b.label) + ' — ' + esc(day) + '</h2>';
    html += '<div class="sub">Truck leaves ' + fmtTime(b.start) + '. Load racks strapped against the front of the truck. Stop 1 unloads first at the rear door.</div>';

    html += '<table class="stops-t"><tr><th>Stop</th><th>Customer</th><th>Load</th></tr>';
    b.stops.forEach(function (nm, i) {
      html += '<tr><td>' + (i + 1) + '</td><td>' + esc(b.customers[nm].short) + '</td><td>' + unitSummary(rk, nm) + '</td></tr>';
    });
    html += '</table>';

    // 6 columns = half-spots: basic rack spans 2 (1 spot), wide/pallet/bin span 3 (1.5 spots)
    html += '<table class="truck-t"><colgroup>';
    for (var ci = 0; ci < ROW_HALVES; ci++) html += '<col style="width:' + (100 / ROW_HALVES) + '%">';
    html += '</colgroup>';
    html += '<tr><td class="cap" colspan="' + ROW_HALVES + '">▲ FRONT OF TRUCK — strap racks here — last stop</td></tr>';
    function tdFor(t) {
      var tag = t.type !== 'rack' ? ' (' + t.type.toUpperCase() + ')' : '';
      return '<td class="filled" colspan="' + tileW(t) + '">' + esc(b.customers[t.customer] ? b.customers[t.customer].short : t.customer) + tag + '</td>';
    }
    function emptyTds(halves) {
      var h = '';
      while (halves >= 2) { h += '<td colspan="2"></td>'; halves -= 2; }
      if (halves === 1) h += '<td></td>';
      return h;
    }
    function barRow() { return '<tr><td class="barrow" colspan="' + ROW_HALVES + '">— LOAD BAR —</td></tr>'; }
    b.rows.forEach(function (row, ri) {
      if (b.dividers.indexOf(ri) !== -1) html += barRow();
      // mirror the on-screen placement exactly (chosen sides included)
      html += '<tr>';
      var cur = 1;
      layoutRow(row).forEach(function (p) {
        html += emptyTds(p.col - cur) + tdFor(p.t);
        cur = p.col + tileW(p.t);
      });
      html += emptyTds(ROW_HALVES + 1 - cur);
      html += '</tr>';
    });
    if (b.dividers.indexOf(TRUCK_ROWS) !== -1) html += barRow();
    html += '<tr><td class="cap" colspan="' + ROW_HALVES + '">▼ REAR DOOR — stop 1, unloads first</td></tr></table>';

    var pks = [];
    Object.keys(b.customers).forEach(function (nm) {
      (b.customers[nm].pickups || []).forEach(function (p) {
        pks.push(esc(b.customers[nm].short) + (p.status === 'OVERDUE' ? ' (overdue since ' + esc(p.pickupDay || '?') + ')' : ''));
      });
      if (b.puOnly[nm] && !(b.customers[nm].pickups || []).length) {
        var ork = otherRun(rk);
        pks.push(esc(b.customers[nm].short) + (ork ? ' (racks on ' + esc(board[ork].label) + ')' : ''));
      }
    });
    if (pks.length) {
      html += '<div class="unplaced-note"><b>Pickups — leave room on the return:</b> ' + pks.join(', ') + '</div>';
    }

    var un = b.tray.filter(function (t) { return t.type !== 'bar'; });
    if (un.length) {
      var byC = {};
      un.forEach(function (t) { byC[t.customer] = (byC[t.customer] || 0) + 1; });
      html += '<div class="unplaced-note"><b>Not placed (decide at the truck):</b> '
            + Object.keys(byC).map(function (nm) { return esc((b.customers[nm] || { short: nm }).short) + ' × ' + byC[nm]; }).join(', ')
            + '</div>';
    }
    html += '</div>';
  });
  document.getElementById('printArea').innerHTML = html;
}

document.getElementById('root').addEventListener('click', function (e) {
  var t = e.target;

  var dv = t.closest ? t.closest('.divider') : null;
  if (dv) {
    var drk = dv.getAttribute('data-run'), at = parseInt(dv.getAttribute('data-at'), 10);
    board[drk].dividers = board[drk].dividers.filter(function (i) { return i !== at; });
    render(); scheduleSave(); return;
  }
  var addbar = t.closest ? t.closest('.addbar') : null;
  if (addbar) {
    var rk = addbar.getAttribute('data-run');
    board[rk].tray.push(mkTile('', 'bar'));
    render(); scheduleSave(); return;
  }
  var mv = t.closest ? t.closest('.mv') : null;
  if (mv) {
    var rk2 = mv.getAttribute('data-run'), i = parseInt(mv.getAttribute('data-i'), 10);
    var stops = board[rk2].stops;
    var j = mv.classList.contains('up') ? i - 1 : i + 1;
    if (j >= 0 && j < stops.length) {
      var tmp = stops[i]; stops[i] = stops[j]; stops[j] = tmp;
      render(); scheduleStopsSave(rk2);
    }
    return;
  }
  var snm = t.closest ? t.closest('.snm') : null;
  if (snm) { openPop(snm.getAttribute('data-run'), snm.getAttribute('data-nm'), e.clientX, e.clientY); return; }
  var addstop = t.closest ? t.closest('.addstop') : null;
  if (addstop) { openAddPop(addstop.getAttribute('data-run'), e.clientX, e.clientY); return; }
});

// "+ Add customer" chooser: lists this run's scheduled customers with no racks on hand.
function openAddPop(rk, x, y) {
  var b = board[rk];
  var h = '<b>Add customer</b>';
  (b.hidden || []).forEach(function (nm) {
    h += '<button class="addc" style="background:' + b.customers[nm].color + '" data-run="' + esc(rk) + '" data-nm="' + esc(nm) + '">' + esc(b.customers[nm].short) + '</button>';
  });
  popCtx = null;
  var pop = document.getElementById('pop');
  pop.innerHTML = h;
  pop.style.display = 'block';
  var w = pop.offsetWidth, ph = pop.offsetHeight;
  pop.style.left = Math.max(8, Math.min(x, window.innerWidth - w - 8)) + 'px';
  pop.style.top = Math.max(8, Math.min(y + 14, window.innerHeight - ph - 8)) + 'px';
}

document.getElementById('pop').addEventListener('click', function (e) {
  var pm = e.target.closest ? e.target.closest('.pm') : null;
  if (pm && popCtx) adjType(popCtx.rk, popCtx.nm, pm.getAttribute('data-ty'), parseInt(pm.getAttribute('data-d'), 10));
  var mvr = e.target.closest ? e.target.closest('.mvrun') : null;
  if (mvr) { moveCustomer(mvr.getAttribute('data-from'), mvr.getAttribute('data-to'), mvr.getAttribute('data-nm')); return; }
  var addc = e.target.closest ? e.target.closest('.addc') : null;
  if (addc) {
    var rk = addc.getAttribute('data-run'), nm = addc.getAttribute('data-nm');
    var b = board[rk];
    b.hidden = (b.hidden || []).filter(function (n) { return n !== nm; });
    if (b.stops.indexOf(nm) === -1) b.stops.push(nm);
    b.tray.push(mkTile(nm, 'rack'));   // seed one rack; crew adjusts in the editor
    render(); scheduleSave(); scheduleStopsSave(rk);
    openPop(rk, nm, e.clientX, e.clientY);
  }
});
document.addEventListener('pointerdown', function (e) {
  if (!e.target.closest) return;
  if (!e.target.closest('#pop') && !e.target.closest('.snm') && !e.target.closest('.tile')) closePop();
}, true);

load();
</script>
