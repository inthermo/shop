<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MN Class D Practice Test</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --ink:#1d2330; --muted:#667085; --line:#d9dde3;
          --accent:#1f5fbf; --ok:#1e8e3e; --okbg:#e6f4ea; --bad:#c5221f; --badbg:#fce8e6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14171c; --card:#1e232b; --ink:#e8eaed; --muted:#9aa3b0; --line:#343b46;
            --accent:#6ea4ff; --ok:#6fcf8a; --okbg:#1c3325; --bad:#ff8a80; --badbg:#3a1f1e; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:720px; margin:0 auto; padding:16px; }
  h1 { font-size:1.4rem; margin:.3em 0; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; margin:14px 0; }
  .muted { color:var(--muted); font-size:.92rem; }
  button { font:inherit; cursor:pointer; border-radius:10px; }
  .pick { display:block; width:100%; text-align:left; padding:14px 16px; margin:8px 0;
          background:var(--card); color:var(--ink); border:1px solid var(--line); }
  .pick:hover:not(:disabled) { border-color:var(--accent); }
  .pick.ok { background:var(--okbg); border-color:var(--ok); }
  .pick.bad { background:var(--badbg); border-color:var(--bad); }
  .pick:disabled { cursor:default; }
  .primary { background:var(--accent); color:#fff; border:0; padding:12px 20px; font-weight:600; }
  .row { display:flex; gap:10px; flex-wrap:wrap; }
  .row .pick { flex:1 1 200px; }
  .bar { height:6px; background:var(--line); border-radius:3px; overflow:hidden; }
  .bar > div { height:100%; background:var(--accent); }
  .explain { margin-top:12px; padding:12px; border-radius:8px; background:var(--bg); }
  .big { font-size:2.4rem; font-weight:700; }
  .pass { color:var(--ok); } .fail { color:var(--bad); }
  .miss { border-top:1px solid var(--line); padding:10px 0; }
</style>
</head>
<body>
<main id="app"></main>

  cross: DIA('#f7c600', `<path d="M60,22 V98 M24,60 H96" stroke="#000" stroke-width="10"/>`),
  curve: DIA('#f7c600', `<path d="M48,92 V66 Q48,44 66,40" fill="none" stroke="#000" stroke-width="9"/><polygon points="80,38 62,28 64,52" fill="#000"/>`),
  slippery: DIA('#f7c600', `<rect x="44" y="30" width="32" height="26" rx="6"/><g fill="none" stroke="#000" stroke-width="4"><path d="M46,62 q-8,8 0,16 q8,8 0,16"/><path d="M74,62 q-8,8 0,16 q8,8 0,16"/></g>`),
  laneends: DIA('#f7c600', `<path d="M48,98 V22 M76,98 V72 L56,40 V22" fill="none" stroke="#000" stroke-width="7"/>`),
  flagger: DIA('#ff7f00', `<circle cx="54" cy="30" r="7"/><g stroke="#000" stroke-width="7" stroke-linecap="round" fill="none"><path d="M54,40 V70 L46,94 M54,70 L62,94 M54,48 L74,40 L80,28"/></g><polygon points="80,22 96,26 82,36" fill="#000"/>`)
};
const signSvg = k => `<svg viewBox="0 0 120 120" width="150" height="150" role="img" aria-label="road sign">${SIGNS[k]}</svg>`;
const LEN = 40, passMark = n => Math.ceil(n * 0.8);
const app = document.getElementById('app');
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S;

function home() {
  const names = Object.keys(TESTS);
  app.innerHTML = `
    <h1>Minnesota Class D Practice Test</h1>
    <p class="muted">Checked against the official <a href="https://assets.dps.mn.gov/files/dvs/dvs-class-d-drivers-manual-english.pdf" target="_blank" rel="noopener">Minnesota Driver's Manual (June 2026)</a>.
    The real test has multiple-choice and true/false questions on traffic laws and road signs, and you need <b>80%</b> to pass.
    The state doesn't publish how many questions there are; unofficial sources say about 40 (32 correct), in one mixed test that includes road-sign pictures. Use <b>Full-Length Mix</b> to practice at that length.
    Also try the state's own <a href="https://assets.dps.mn.gov/files/dvs/dvs-class-d-practice-test.pdf" target="_blank" rel="noopener">DPS practice test</a>.</p>
    <div class="card">
      ${names.map((n, i) => `<button class="pick" data-t="${i}"><b>${esc(n)}</b><br><span class="muted">${TESTS[n].length} questions</span></button>`).join('')}
      <button class="pick" data-t="mix"><b>Full-Length Mix</b><br><span class="muted">40 random questions from all tests — like the real thing</span></button>
    </div>`;
  app.querySelectorAll('[data-t]').forEach(b => b.onclick = () => {
    const t = b.dataset.t;
    const qs = t === 'mix' ? shuffle(names.flatMap(n => TESTS[n])).slice(0, LEN) : names[t].startsWith('Official') ? TESTS[names[t]].slice() : shuffle(TESTS[names[t]]);
    start(t === 'mix' ? 'Full-Length Mix' : names[t], qs);
  });
}

function start(name, qs) { S = { name, qs, i: 0, right: 0, missed: [], fixed: name.startsWith('Official') }; ask(); window.scrollTo(0, 0); }

function ask() {
  const [q, choices, ans, why, sign] = S.qs[S.i];
  const order = (choices.length === 2 || S.fixed) ? choices.map((c, k) => k) : shuffle(choices.map((c, k) => k));
  app.innerHTML = `
    <p class="muted">${esc(S.name)} · Question ${S.i + 1} of ${S.qs.length} · ${S.right} correct</p>
    <div class="bar"><div style="width:${100 * S.i / S.qs.length}%"></div></div>
    <div class="card">
      ${sign ? `<div style="text-align:center">${signSvg(sign)}</div>` : ''}
      <p><b>${esc(q)}</b></p>
      ${order.map(k => `<button class="pick" data-k="${k}">${esc(choices[k])}</button>`).join('')}
      <div id="fb"></div>
    </div>
    <button class="pick" id="quit" style="width:auto">Quit to menu</button>`;
  document.getElementById('quit').onclick = home;
  app.querySelectorAll('[data-k]').forEach(b => b.onclick = () => {
    const k = +b.dataset.k, ok = k === ans;
    app.querySelectorAll('[data-k]').forEach(x => {
      x.disabled = true;
      if (+x.dataset.k === ans) x.classList.add('ok');
    });
    if (ok) S.right++; else { b.classList.add('bad'); S.missed.push([q, choices[k], choices[ans], why, sign]); }
    const last = S.i === S.qs.length - 1;
    document.getElementById('fb').innerHTML = `
      <div class="explain"><b class="${ok ? 'pass' : 'fail'}">${ok ? 'Correct!' : 'Not quite.'}</b> ${esc(why)}</div>
      <p><button class="primary" id="next">${last ? 'See my score' : 'Next question'}</button></p>`;
    const n = document.getElementById('next');
    n.onclick = () => { if (last) done(); else { S.i++; ask(); } };
    n.focus();
  });
}

function done() {
  const PASS = passMark(S.qs.length), passed = S.right >= PASS;
  app.innerHTML = `
    <h1>${esc(S.name)}</h1>
    <div class="card" style="text-align:center">
      <div class="big ${passed ? 'pass' : 'fail'}">${S.right} / ${S.qs.length}</div>
      <p><b class="${passed ? 'pass' : 'fail'}">${passed ? 'PASS' : 'NOT YET'}</b> — need ${PASS} to pass.</p>
      <div class="row">
        <button class="primary" id="again">Retake this test</button>
        <button class="pick" id="menu" style="text-align:center">Pick another test</button>
      </div>
    </div>
    ${S.missed.length ? `<div class="card"><h2 style="font-size:1.1rem;margin-top:0">Review what you missed</h2>
      ${S.missed.map(([q, you, right, why, sign]) => `<div class="miss">${sign ? `<div>${signSvg(sign).replace(/150/g, '80')}</div>` : ''}<b>${esc(q)}</b><br>
        <span class="fail">Your answer: ${esc(you)}</span><br>
        <span class="pass">Correct: ${esc(right)}</span><br><span class="muted">${esc(why)}</span></div>`).join('')}</div>` : ''}`;
  const qs = S.qs, name = S.name;
  document.getElementById('again').onclick = () => start(name, shuffle(qs));
  document.getElementById('menu').onclick = home;
  window.scrollTo(0, 0);
}

home();
</script>
</body>
</html>
